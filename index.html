<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Портфолио</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f4f0;
      --ink: #1a1a1a;
      --mid: #6b6b6b;
      --light: #d4d2cc;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier Prime', 'Courier New', monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      border-bottom: 1px solid var(--ink);
      padding: 18px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
    }

    nav ul { list-style: none; display: flex; gap: 36px; }

    nav a {
      text-decoration: none;
      color: var(--ink);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    nav a:hover, nav a.active { border-color: var(--ink); }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      padding: 52px 48px 52px;
      gap: 48px;
      align-items: start;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 0.88rem;
      color: var(--mid);
      line-height: 1.65;
      max-width: 380px;
      margin-bottom: 28px;
    }

    .hero-links { display: flex; gap: 20px; flex-wrap: wrap; }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-family: 'Courier Prime', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 28px;
      border: 1px solid var(--ink);
      color: var(--ink);
      transition: background 0.18s, color 0.18s;
    }

    .btn:hover { background: var(--ink); color: var(--bg); }
    .btn.filled { background: var(--ink); color: var(--bg); }
    .btn.filled:hover { background: transparent; color: var(--ink); }

    .hero-visual {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 8px;
    }

    .photo-frame {
      border: 1px solid var(--ink);
      overflow: hidden;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.05);
    }

    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 7px 12px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      background: var(--bg);
      border-top: 1px solid var(--light);
    }

    .photo-main { aspect-ratio: 4/5; }

    .photo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .photo-small { aspect-ratio: 1/1; }

    hr.divider {
      border: none;
      border-top: 1px solid var(--light);
      margin: 0 48px;
    }

    footer {
      padding: 22px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--light);
      font-size: 0.7rem;
      color: var(--mid);
      letter-spacing: 0.1em;
    }

    @media (max-width: 700px) {
      nav { padding: 16px 20px; }
      .hero { grid-template-columns: 1fr; padding: 40px 20px; gap: 40px; }
      .hero-visual { order: -1; }
      hr.divider { margin: 0 20px; }
      footer { padding: 16px 20px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <span class="logo">geolav</span>
  <ul>
    <li><a href="/" class="active">Главная</a></li>
    <li><a href="/resume/">Резюме</a></li>
    <li><a href="/projects/">Проекты</a></li>
  </ul>
</nav>

<main class="hero">
  <div class="hero-text">
    <h1>geolav</h1>
    <p class="hero-desc">
      Программист. Здесь лежат резюме и проекты.
    </p>
    <div class="hero-links">
      <a class="btn filled" href="/resume/">Резюме</a>
      <a class="btn" href="/projects/">Проекты</a>
    </div>
  </div>

  <div class="hero-visual">
    <div class="photo-frame photo-main">
      <!-- ЗАМЕНИТЕ src на ваше фото -->
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80&auto=format&fit=crop" alt="Портрет" />
      <span class="photo-caption">Фото / 2024</span>
    </div>
    <div class="photo-row">
      <div class="photo-frame photo-small">
        <!-- ЗАМЕНИТЕ src на ваше фото -->
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400&q=80&auto=format&fit=crop" alt="Код" />
        <span class="photo-caption">Код</span>
      </div>
      <div class="photo-frame photo-small">
        <!-- ЗАМЕНИТЕ src на ваше фото -->
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=400&q=80&auto=format&fit=crop" alt="Проекты" />
        <span class="photo-caption">Проекты</span>
      </div>
    </div>
  </div>
</main>

<hr class="divider">

<footer>
  <span>© 2024 Georgiy Lavrentev </span>
</footer>

</body>
</html>
